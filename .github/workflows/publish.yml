name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published GitHub release tag (for example v0.1.0)"
        required: true
        type: string
      wheel_run_id:
        description: "Successful Wheels run ID triggered by pushing that tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify release and build provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a successful tag build from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          run_id = os.environ["WHEEL_RUN_ID"]
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Dispatch the publishing workflow from main")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or not run_id.isdigit():
              raise SystemExit("Expected a stable vX.Y.Z tag and a numeric wheel run ID")
          release = api(f"repos/{repo}/releases/tags/{tag}")
          if release["draft"] or release["prerelease"] or not release["published_at"]:
              raise SystemExit("Publish a stable GitHub release before publishing to PyPI")
          ref = api(f"repos/{repo}/git/ref/tags/{tag}")["object"]
          while ref["type"] == "tag":
              ref = api(f"repos/{repo}/git/tags/{ref['sha']}")["object"]
          if ref["type"] != "commit":
              raise SystemExit("Release tag does not point to a commit")
          run = api(f"repos/{repo}/actions/runs/{run_id}")
          expected = {
              "path": ".github/workflows/wheels.yml",
              "event": "push",
              "status": "completed",
              "conclusion": "success",
              "head_sha": ref["sha"],
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(f"Unexpected build {field}: {run.get(field)!r}, expected {value!r}")
          if run["head_repository"]["full_name"] != repo:
              raise SystemExit("Wheel build was not run from this repository")
          print(f"Verified {tag} at {ref['sha']} from Wheels run {run_id}")
          PY
      - name: Download only that run's complete distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.wheel_run_id }}
      - name: Verify versions, complete platform coverage, and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/check_release_artifacts.py dist
          --version "${RELEASE_TAG#v}" --complete --check-checksums
      - name: Prepare only package distributions for upload
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
          python -m pip install twine
          python -m twine check --strict publish-dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-pypi-dist
          path: publish-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/polygonal-path-image/
    permissions:
      id-token: write
    steps:
      # No checkout, build, or repository code runs in the OIDC-enabled job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-pypi-dist
          path: dist
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
