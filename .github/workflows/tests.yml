name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
        numpy: ["2"]
        include:
          - os: ubuntu-latest
            python: "3.11"
            numpy: "1.26"
          - os: ubuntu-latest
            python: "3.12"
            numpy: "2"
          - os: ubuntu-latest
            python: "3.13"
            numpy: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build source distribution and wheel from source distribution
        run: python -m build
      - name: Install wheel and chosen runtime NumPy
        shell: bash
        run: |
          if [ "${{ matrix.numpy }}" = "1.26" ]; then
            python -m pip install dist/*.whl pytest "numpy==1.26.4"
          else
            python -m pip install dist/*.whl pytest "numpy>=2,<3"
          fi
      - name: Test installed distribution
        run: python -m pytest
      - name: Verify package metadata
        run: python -m pip check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff build twine
      - run: ruff check .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Preserve distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-and-linux-wheel
          path: dist/*
