[build-system]
requires = ["setuptools>=77.0.3", "Cython>=3.0,<4", "numpy>=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "polygonal-path-image"
version = "0.1.0"
description = "Polygonal path images and path voting for curvilinear structure enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [
  {name = "Paula Agregán Reboredo"},
  {name = "Vincent Bismuth"},
  {name = "Laurent Najman"},
]
maintainers = [{name = "Laurent Najman"}]
keywords = ["image-processing", "polygonal-path", "curvilinear", "segmentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Cython",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
examples = ["Pillow>=10", "matplotlib>=3.8"]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.11", "twine>=6"]

[project.urls]
Repository = "https://github.com/lnajman/polygonal-path-image"
Issues = "https://github.com/lnajman/polygonal-path-image/issues"
Changelog = "https://github.com/lnajman/polygonal-path-image/blob/main/CHANGELOG.md"
"Reference paper" = "https://hal.science/hal-00741956v1/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polygonal_path_image = ["*.pyx", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["research", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
